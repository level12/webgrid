[build-system]
requires = [
    'hatchling',
]
build-backend = 'hatchling.build'


[project]
name = 'WebGrid'
description = 'A library for rendering HTML tables and Excel files from SQLAlchemy models.'
authors = [
    {name = 'Level 12', email = 'devteam@level12.io'},
]
requires-python = '>=3.12'
dynamic = ['version']
readme = 'readme.md'
license.file = 'license.txt'
urls.homepage = 'https://github.com/level12/webgrid'
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
dependencies = [
    'arrow>=1.3.0',
    'BlazeUtils>=0.6.0',
    'SQLAlchemy>=2.0',
    'jinja2',
    'python-dateutil',
    'Werkzeug',
]


[project.optional-dependencies]
i18n = ['morphi']


[dependency-groups]
dev = [
    {include-group = 'pytest'},
    {include-group = 'prek'},
    {include-group = 'audit'},
    {include-group = 'nox'},
    {include-group = 'docs'},
    'click',
    'ruff',
]
pytest = [
    'flask>=3.0.3',
    'flask-bootstrap>=3.3.7.1',
    'flask-sqlalchemy>=3.1.1',
    'flask-webtest>=0.1.6',
    'flask-wtf>=1.2.2',
    'openpyxl>=3.1.5',
    'psycopg[binary]>=3.2.9',
    'pyquery>=2.0.1',
    'pytest',
    'pytest-cov',
    'sqlalchemy-utils>=0.41.2',
    # PyPI's current morphi release still imports distutils on Python 3.15.
    'setuptools',
    'xlsxwriter>=3.2.5',
]
mssql = [
    'pyodbc',
]
docs = [
    'pytz',
    'sphinx',
]
prek = [
    'prek',
]
audit = [
    'pip-audit',
]
build = [
    'build',
    'twine',
]
nox = [
    'nox',
]


############## TOOLS #####################

[tool.babel.extract_messages]
input_dirs   = ['src/webgrid']
mapping_file = 'src/webgrid/i18n/babel.cfg'
output_file  = 'src/webgrid/i18n/webgrid.pot'

[tool.babel.init_catalog]
domain     = 'webgrid'
input_file = 'src/webgrid/i18n/webgrid.pot'
output_dir = 'src/webgrid/i18n'

[tool.babel.update_catalog]
domain     = 'webgrid'
input_file = 'src/webgrid/i18n/webgrid.pot'
output_dir = 'src/webgrid/i18n'

[tool.babel.compile_catalog]
domain    = 'webgrid'
directory = 'src/webgrid/i18n'

[tool.babel.compile_json]
domain     = 'webgrid'
directory = 'src/webgrid/i18n'
output_dir = 'src/webgrid/static/i18n'
