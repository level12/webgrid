name: Nox

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  nox-other:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        session: [audit, build, docs, prek, pytest_i18n, translations]

    steps:
      - uses: level12/coppy/gh-actions/nox-run@main
        with:
          nox-session: ${{ matrix.session }}

  nox-pytest:
    name: ${{ matrix.session }} (${{ matrix.database }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - session: pytest-3.12
            database: postgres
            db: pg
          - session: pytest-3.13
            database: postgres
            db: pg
          - session: pytest-3.14
            database: postgres
            db: pg
          - session: pytest-3.15
            database: postgres
            db: pg
          - session: pytest-3.12
            database: sqlite
            db: sqlite
          - session: pytest-3.13
            database: sqlite
            db: sqlite
          - session: pytest-3.14
            database: sqlite
            db: sqlite
          - session: pytest-3.15
            database: sqlite
            db: sqlite
          - session: pytest_mssql-3.15
            database: mssql
            db: mssql

    services:
      postgres:
        image: ${{ matrix.database == 'postgres' && 'postgres:15-alpine' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
      mssql:
        image: ${{ matrix.database == 'mssql' && 'mcr.microsoft.com/mssql/server:2022-latest' || '' }}
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: Docker-sa-password
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P 'Docker-sa-password' -C -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install Microsoft ODBC Driver 18
        if: matrix.database == 'mssql'
        run: |
          curl -sSL https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb -o /tmp/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - uses: level12/coppy/gh-actions/nox-run@main
        env:
          WEBTEST_DB: ${{ matrix.db }}
        with:
          nox-session: ${{ matrix.session }}

      - uses: codecov/codecov-action@v5
        with:
          use_oidc: true
